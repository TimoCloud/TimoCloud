name: Release

on:
  push:
    branches:
      - master      # Triggert bei jedem Push auf den master-Branch
    tags:
      - "v*"        # Triggert weiterhin bei neuen Tags (z.B. v2.0)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Build release
        run: mvn -B clean package -DskipTests --file pom.xml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Logik: Wenn es ein Tag ist, nutze den Tag-Namen. Ansonsten nenne es "latest"
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Development Build (latest)' }}
          # Master-Pushes werden automatisch als "Pre-release" markiert
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          files: |
            TimoCloud-Universal/target/TimoCloud.jar
