name: Build & Release

on:
  push:
    branches: [master, "**"]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["8"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build with Maven
        run: mvn -B clean install --file pom.xml

      - name: Run tests
        run: mvn -B test --file pom.xml

      - name: Upload TimoCloud.jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TimoCloud-jar
          path: TimoCloud-Universal/target/TimoCloud.jar
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create Release
    needs: build 
    runs-on: ubuntu-latest
    

    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Download TimoCloud.jar artifact
        uses: actions/download-artifact@v4
        with:
          name: TimoCloud-jar
          path: release-files/ 

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Build #{0}', github.run_number) }}
          generate_release_notes: true
          make_latest: true
          files: release-files/TimoCloud.jar